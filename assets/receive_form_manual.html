<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Receive - Form Penerimaan Barang</title>
<style>
  :root{
    --paper:#F6F4EF; --card:#FFFFFF; --ink:#1E2430; --muted:#6B7280;
    --line:#D9D5CB; --field:#BFBAAE; --head:#F0EDE5; --accent:#1F4E79;
    --accent-soft:#E6EEF6; --warn:#B45309; --ok:#2F6B3A;
  }
  *{box-sizing:border-box}
  body{margin:0; background:var(--paper); color:var(--ink);
    font-family:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; font-size:14px; line-height:1.45}
  .wrap{max-width:1100px; margin:0 auto; padding:24px 16px 96px}
  header{display:flex; justify-content:space-between; align-items:flex-end; gap:8px;
    border-bottom:2px solid var(--ink); padding-bottom:12px; margin-bottom:20px}
  h1{font-size:22px; margin:0; font-weight:600; letter-spacing:-.01em}
  .sub{color:var(--muted); font-size:13px}
  section{background:var(--card); border:1px solid var(--line); border-radius:6px; padding:18px; margin-bottom:16px}
  h2{font-size:14px; margin:0 0 14px; font-weight:600; display:flex; align-items:center; gap:8px}
  h2 .n{width:22px; height:22px; border-radius:50%; background:var(--ink); color:#fff;
    display:inline-grid; place-items:center; font-size:12px}
  .grid{display:grid; gap:12px 16px; grid-template-columns:repeat(auto-fit,minmax(200px,1fr))}
  label{display:flex; flex-direction:column; gap:4px; font-size:12px; color:var(--muted)}
  .req::after{content:" *"; color:var(--warn)}
  input,select{font:inherit; color:var(--ink); background:#fff; width:100%; min-height:36px;
    border:1px solid var(--field); border-radius:4px; padding:8px 10px}
  input:focus,select:focus{outline:2px solid var(--accent); outline-offset:1px; border-color:transparent}
  input[readonly]{background:var(--accent-soft); color:var(--accent); font-weight:500}
  .hint{font-size:12px; color:var(--muted); margin-top:2px}
  .table-wrap{overflow-x:auto}
  table{width:100%; border-collapse:collapse; min-width:860px}
  th,td{border:1px solid var(--line); padding:6px; text-align:left; vertical-align:middle}
  th{background:var(--head); font-size:12px; font-weight:600; color:var(--muted)}
  td input,td select{padding:6px 8px; min-height:32px}
  td.idx{text-align:center; font-weight:600; width:52px}
  td.tag{width:110px}
  td.pk{width:110px; font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; color:var(--accent);
    font-weight:500; white-space:nowrap}
  td.uom{width:96px}
  tr.first td{border-top:2px solid var(--ink)}
  .actions{display:flex; gap:10px; justify-content:flex-end; align-items:center; margin-top:8px; flex-wrap:wrap}
  .msg{margin-right:auto; color:var(--muted); font-size:13px}
  .msg.err{color:var(--warn)}
  .msg.ok{color:var(--ok)}
  button{font:inherit; cursor:pointer; padding:10px 18px; border-radius:4px;
    border:1px solid var(--ink); background:transparent; color:var(--ink)}
  button.primary{background:var(--ink); color:#fff}
  button:focus-visible{outline:2px solid var(--accent); outline-offset:2px}
  #out{white-space:pre-wrap; background:var(--ink); color:#E5E7EB; border-radius:6px; padding:14px;
    font-family:"IBM Plex Mono",ui-monospace,Menlo,monospace; font-size:12px; display:none;
    overflow:auto; max-height:360px; margin-top:16px}
  @media (max-width:600px){ header{flex-direction:column; align-items:flex-start} }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div>
      <h1>Receive</h1>
      <div class="sub">Form penerimaan barang</div>
    </div>
    <div class="sub">Lokasi default: Bulk area</div>
  </header>

  <form id="f" autocomplete="off">

    <!-- 1. Dokumen & kendaraan -->
    <section>
      <h2><span class="n">1</span>Informasi penerimaan</h2>
      <div class="grid">
        <label>Part <input id="part" type="text" placeholder="Nama part"></label>
        <label>Part # <input id="partNo" type="text" placeholder="Nomor part"></label>
        <label>Group / Ukuran <input id="group" type="text" placeholder="Group / ukuran"></label>

        <label>Tanggal terima <input id="recvDate" type="date"></label>
        <label class="req">Truk # <input id="truck" type="text" placeholder="Nomor truk" required></label>
        <label>Nama driver <input id="driver" type="text" placeholder="Nama driver"></label>

        <label>No. PO <input id="noPo" type="text" placeholder="Nomor PO"></label>
        <label>No. AJU <input id="noAju" type="text" placeholder="Nomor AJU"></label>
        <label>Lokasi
          <input id="location" type="text" value="Bulk area" readonly>
          <span class="hint">Otomatis default Bulk area</span>
        </label>
      </div>
    </section>

    <!-- 2. Bundle & packing -->
    <section>
      <h2><span class="n">2</span>Bundle & packing</h2>
      <div class="grid">
        <label>Jumlah bundle
          <input id="bundleQty" type="number" min="1" max="50" value="4">
          <span class="hint">Jumlah baris tag</span>
        </label>
        <label>Tipe bundle
          <select id="bundleType">
            <option>Bundle</option><option>Skid</option><option>Pallet</option>
          </select>
        </label>
        <label>Jumlah packing
          <input id="packQty" type="number" min="1" max="20" value="3">
          <span class="hint">Packing per bundle</span>
        </label>
        <label>Tipe packing
          <select id="packingType">
            <option selected>COIL</option><option>SHEET</option><option>BOX</option>
            <option>DRUM</option><option>PALLET</option>
          </select>
        </label>
      </div>
    </section>

    <!-- 3. Detail -->
    <section>
      <h2><span class="n">3</span>Detail bundle</h2>
      <div class="table-wrap">
        <table>
          <thead>
            <tr>
              <th>No</th><th>Tag #</th><th>Packing #</th><th>Qty/packing</th>
              <th>UOM</th><th>Net weight (kg)</th><th>Gross weight (kg)</th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
    </section>

    <div class="actions">
      <span id="msg" class="msg"></span>
      <button type="button" id="reset">Reset</button>
      <button type="submit" class="primary">Simpan</button>
    </div>

    <pre id="out"></pre>
  </form>
</div>

<script>
  const UOMS = ["kg", "pcs", "m", "roll"];

  const $ = s => document.querySelector(s);
  const esc = v => String(v ?? "").replace(/"/g, "&quot;");
  const num = v => (v === "" || v == null) ? null : Number(v);
  const clamp = (v, min, max) => {
    let n = parseInt(v, 10);
    if (isNaN(n)) n = min;
    return Math.min(max, Math.max(min, n));
  };

  const bundleQty = $("#bundleQty");
  const packQty   = $("#packQty");
  const tbody     = $("#rows");
  const msg       = $("#msg");
  const out       = $("#out");

  let bundles = []; // [{ tag, rows: [{ qty, uom, net, gross }] }]
  const newRow = () => ({ qty: "", uom: "kg", net: "", gross: "" });

  // Struktur tabel mengikuti jumlah bundle dan packing. Tag # diisi manual.
  function resize() {
    const nb = clamp(bundleQty.value, 1, 50);
    const np = clamp(packQty.value, 1, 20);
    bundleQty.value = nb;
    packQty.value = np;
    while (bundles.length < nb) bundles.push({ tag: "", rows: [] });
    bundles.length = nb;
    bundles.forEach(b => {
      while (b.rows.length < np) b.rows.push(newRow());
      b.rows.length = np;
    });
    render();
  }

  function render() {
    tbody.innerHTML = "";
    bundles.forEach((b, bi) => {
      b.rows.forEach((r, ri) => {
        const tr = document.createElement("tr");
        if (ri === 0) tr.className = "first";
        let html = "";
        if (ri === 0) {
          html += `<td class="idx" rowspan="${b.rows.length}">${bi + 1}</td>`;
          html += `<td class="tag" rowspan="${b.rows.length}">
                     <input type="text" inputmode="numeric" data-tag="${bi}" value="${esc(b.tag)}">
                   </td>`;
        }
        html += `
          <td class="pk" data-pk="${bi}" data-r="${ri}">${b.tag || "-"}/${ri + 1}</td>
          <td><input type="number" min="0" step="any" data-b="${bi}" data-r="${ri}" data-k="qty" value="${esc(r.qty)}"></td>
          <td class="uom"><select data-b="${bi}" data-r="${ri}" data-k="uom">
            ${UOMS.map(u => `<option ${u === r.uom ? "selected" : ""}>${u}</option>`).join("")}
          </select></td>
          <td><input type="number" min="0" step="any" data-b="${bi}" data-r="${ri}" data-k="net" value="${esc(r.net)}"></td>
          <td><input type="number" min="0" step="any" data-b="${bi}" data-r="${ri}" data-k="gross" value="${esc(r.gross)}"></td>`;
        tr.innerHTML = html;
        tbody.appendChild(tr);
      });
    });
  }

  tbody.addEventListener("input", e => {
    const t = e.target;
    if (t.dataset.tag !== undefined) {
      const bi = Number(t.dataset.tag);
      bundles[bi].tag = t.value;
      document.querySelectorAll(`[data-pk="${bi}"]`).forEach(el => {
        el.textContent = `${t.value || "-"}/${Number(el.dataset.r) + 1}`;
      });
    } else if (t.dataset.k) {
      bundles[Number(t.dataset.b)].rows[Number(t.dataset.r)][t.dataset.k] = t.value;
    }
  });
  tbody.addEventListener("change", e => {
    const t = e.target;
    if (t.dataset.k) bundles[Number(t.dataset.b)].rows[Number(t.dataset.r)][t.dataset.k] = t.value;
  });

  bundleQty.addEventListener("change", resize);
  packQty.addEventListener("change", resize);

  function setMsg(text, kind = "") {
    msg.textContent = text;
    msg.className = "msg " + kind;
  }

  function setDefaults() {
    $("#recvDate").value = new Date().toISOString().slice(0, 10);
    $("#location").value = "Bulk area";
  }

  $("#reset").addEventListener("click", () => {
    if (!confirm("Kosongkan semua isian?")) return;
    $("#f").reset();
    bundles = [];
    bundleQty.value = 4;
    packQty.value = 3;
    setDefaults();
    out.style.display = "none";
    setMsg("");
    resize();
  });

  $("#f").addEventListener("submit", e => {
    e.preventDefault();
    const val = id => $("#" + id).value.trim();

    if (!val("truck")) { setMsg("Truk # wajib diisi.", "err"); $("#truck").focus(); return; }
    const missing = bundles.findIndex(b => !String(b.tag).trim());
    if (missing !== -1) {
      setMsg(`Tag # baris ${missing + 1} belum diisi.`, "err");
      tbody.querySelector(`[data-tag="${missing}"]`).focus();
      return;
    }

    let totQty = 0, totNet = 0, totGross = 0, totPacking = 0;
    const payload = {
      header: {
        part: val("part"), partNo: val("partNo"), groupUkuran: val("group"),
        receiveDate: val("recvDate"), truck: val("truck"), driver: val("driver"),
        noPo: val("noPo"), noAju: val("noAju"), location: "Bulk area",
        bundleType: val("bundleType"), packingType: val("packingType")
      },
      bundles: bundles.map((b, bi) => ({
        no: bi + 1,
        tag: String(b.tag).trim(),
        packings: b.rows.map((r, ri) => {
          totPacking++;
          totQty   += Number(r.qty)   || 0;
          totNet   += Number(r.net)   || 0;
          totGross += Number(r.gross) || 0;
          return { packingNo: `${b.tag}/${ri + 1}`, qty: num(r.qty), uom: r.uom,
                   netWeight: num(r.net), grossWeight: num(r.gross) };
        })
      })),
      totals: { bundles: bundles.length, packings: totPacking,
                qty: totQty, netWeight: totNet, grossWeight: totGross }
    };

    out.textContent = JSON.stringify(payload, null, 2);
    out.style.display = "block";
    setMsg(`Tersimpan (simulasi): ${bundles.length} bundle, ${totPacking} packing.`, "ok");
  });

  setDefaults();
  resize();
</script>
</body>
</html>
